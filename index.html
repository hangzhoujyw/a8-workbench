<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A8工作台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --text-primary: #eaeaea;
            --text-secondary: #a0a0a0;
            --accent: #00d9ff;
            --accent-hover: #00b8d9;
            --success: #00c853;
            --warning: #ffa726;
            --danger: #ef5350;
            --border: #2a2a4a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .app { display: flex; flex-direction: column; min-height: 100vh; }
        .header {
            background: var(--bg-secondary);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 20px; font-weight: 600; color: var(--accent); }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .user-name { color: var(--text-secondary); font-size: 14px; }
        .main-container { display: flex; flex: 1; }
        .sidebar {
            width: 200px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 16px 0;
        }
        .nav-list { list-style: none; }
        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            cursor: pointer;
            transition: all 0.2s;
            gap: 12px;
            color: var(--text-secondary);
        }
        .nav-item:hover { background: var(--bg-card); color: var(--text-primary); }
        .nav-item.active {
            background: var(--bg-card);
            color: var(--accent);
            border-left: 3px solid var(--accent);
        }
        .nav-icon { font-size: 18px; }
        .content { flex: 1; padding: 24px; overflow-y: auto; }
        .module-content { display: none; }
        .module-content.active { display: block; }
        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .module-header h2 { font-size: 24px; font-weight: 600; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: var(--bg-primary); }
        .btn-primary:hover { background: var(--accent-hover); }
        .task-stats, .review-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-number { font-size: 32px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-item {
            background: var(--bg-card);
            padding: 16px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .task-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 217, 255, 0.1);
        }
        .task-info { flex: 1; }
        .task-name { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
        .task-meta { font-size: 13px; color: var(--text-secondary); }
        .task-status { display: flex; align-items: center; gap: 12px; }
        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-active { background: rgba(0, 200, 83, 0.2); color: var(--success); }
        .status-inactive { background: rgba(160, 160, 160, 0.2); color: var(--text-secondary); }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .toggle-switch.active { background: var(--success); }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .toggle-switch.active::after { left: 22px; }
        .template-categories {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .category-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
        }
        .category-card h3 { font-size: 16px; margin-bottom: 16px; color: var(--accent); }
        .template-list { display: flex; flex-direction: column; gap: 10px; }
        .template-item {
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .template-item:hover { background: var(--border); }
        .template-name { font-size: 14px; font-weight: 500; display: block; margin-bottom: 4px; }
        .template-desc { font-size: 12px; color: var(--text-secondary); }
        .project-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .project-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 217, 255, 0.15);
        }
        .project-name { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .project-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
        .project-progress { display: flex; align-items: center; gap: 8px; }
        .progress-bar {
            flex: 1;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.3s;
        }
        .progress-text { font-size: 12px; color: var(--text-secondary); min-width: 36px; }
        .knowledge-categories {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .knowledge-category {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
        }
        .knowledge-category h3 { font-size: 16px; margin-bottom: 16px; }
        .knowledge-list { list-style: none; }
        .knowledge-list li {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            color: var(--text-secondary);
        }
        .knowledge-list li:last-child { border-bottom: none; }
        .review-list { display: flex; flex-direction: column; gap: 12px; }
        .review-item {
            background: var(--bg-card);
            padding: 16px 20px;
            border-radius: 8px;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .review-title { font-size: 15px; font-weight: 500; }
        .review-date { font-size: 12px; color: var(--text-secondary); }
        .review-status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-bottom: 8px;
        }
        .review-status.pending { background: rgba(255, 167, 38, 0.2); color: var(--warning); }
        .review-status.completed { background: rgba(0, 200, 83, 0.2); color: var(--success); }
        .review-summary { font-size: 13px; color: var(--text-secondary); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state-text { font-size: 14px; }
        /* Project Detail View */
        .project-detail { display: none; }
        .project-detail.active { display: block; }
        .project-list-view.hidden { display: none; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; color: var(--text-secondary); font-size: 14px; }
        .breadcrumb a { color: var(--accent); cursor: pointer; text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        .project-detail-header { margin-bottom: 24px; }
        .project-detail-header h2 { font-size: 24px; margin-bottom: 8px; }
        .project-detail-desc { color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }
        .project-detail-progress { display: flex; align-items: center; gap: 12px; }
        .project-detail-progress .progress-bar { height: 8px; flex: 1; max-width: 400px; }
        .project-detail-progress .progress-text { font-size: 16px; font-weight: 600; color: var(--accent); }
        .kanban-board { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 16px; }
        .kanban-column { min-width: 260px; max-width: 280px; background: var(--bg-secondary); border-radius: 8px; padding: 16px; flex-shrink: 0; }
        .kanban-column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
        .kanban-column-title { font-size: 14px; font-weight: 600; }
        .kanban-column-count { background: var(--bg-card); padding: 2px 8px; border-radius: 10px; font-size: 11px; color: var(--text-secondary); }
        .kanban-column.status-completed .kanban-column-header { border-bottom-color: var(--success); }
        .kanban-column.status-in-progress .kanban-column-header { border-bottom-color: var(--accent); }
        .kanban-column.status-not-started .kanban-column-header { border-bottom-color: var(--text-secondary); }
        .kanban-card { background: var(--bg-card); padding: 12px; border-radius: 6px; margin-bottom: 8px; }
        .kanban-card:last-child { margin-bottom: 0; }
        .kanban-card-title { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
        .kanban-card-meta { font-size: 11px; color: var(--text-secondary); }
        .kanban-card-tag { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-top: 6px; }
        .tag-deliverable { background: rgba(0, 217, 255, 0.2); color: var(--accent); }
        .tag-milestone { background: rgba(255, 167, 38, 0.2); color: var(--warning); }
        .tag-task { background: rgba(160, 160, 160, 0.15); color: var(--text-secondary); }
        /* Template Detail View */
        .template-detail { display: none; margin-top: 20px; }
        .template-detail.active { display: block; }
        .template-detail-card { background: var(--bg-card); border-radius: 8px; padding: 24px; }
        .template-detail-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .template-detail-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
        .template-preview { background: var(--bg-secondary); border-radius: 6px; padding: 16px; margin-bottom: 20px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
        .template-var { background: rgba(0, 217, 255, 0.2); color: var(--accent); padding: 1px 6px; border-radius: 3px; font-weight: 500; }
        .template-form { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
        .template-form-item { display: flex; align-items: center; gap: 12px; }
        .template-form-item label { min-width: 80px; font-size: 14px; color: var(--text-secondary); }
        .template-form-item input { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text-primary); font-size: 14px; outline: none; }
        .template-form-item input:focus { border-color: var(--accent); }
        .template-actions { display: flex; gap: 12px; }
        .btn-copy { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-copy:hover { border-color: var(--accent); color: var(--accent); }
        /* Knowledge Base */
        .knowledge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .knowledge-panel { background: var(--bg-card); border-radius: 8px; overflow: hidden; }
        .knowledge-panel-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
        .knowledge-panel-header:hover { background: rgba(0,217,255,0.05); }
        .knowledge-panel-header h3 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .knowledge-panel-count { background: var(--bg-secondary); padding: 2px 10px; border-radius: 10px; font-size: 12px; color: var(--text-secondary); }
        .knowledge-panel-body { display: none; padding: 0 20px 16px; }
        .knowledge-panel.expanded .knowledge-panel-body { display: block; }
        .knowledge-item { padding: 12px; background: var(--bg-secondary); border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
        .knowledge-item:hover { background: var(--border); }
        .knowledge-item:last-child { margin-bottom: 0; }
        .knowledge-item-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .knowledge-item-meta { font-size: 12px; color: var(--text-secondary); }
        .knowledge-item-tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: rgba(0,217,255,0.15); color: var(--accent); }
        .knowledge-detail { display: none; margin-top: 20px; }
        .knowledge-detail.active { display: block; }
        .knowledge-detail-card { background: var(--bg-card); border-radius: 8px; padding: 24px; }
        .knowledge-detail-content { background: var(--bg-secondary); border-radius: 6px; padding: 16px; margin: 16px 0; font-size: 14px; line-height: 1.8; white-space: pre-wrap; color: var(--text-secondary); }
        .knowledge-detail-content strong { color: var(--text-primary); }
        /* Daily Todo & Home */
        .daily-todo-container { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
        .todo-section { background: var(--bg-card); border-radius: 8px; padding: 20px; }
        .todo-section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .todo-list { display: flex; flex-direction: column; gap: 10px; }
        .todo-item { background: var(--bg-secondary); padding: 12px 16px; border-radius: 6px; display: flex; align-items: center; gap: 12px; transition: all 0.2s; }
        .todo-item:hover { background: var(--border); }
        .todo-checkbox { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 4px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .todo-checkbox.checked { background: var(--success); border-color: var(--success); }
        .todo-checkbox.checked::after { content: '✓'; color: white; font-size: 12px; font-weight: bold; }
        .todo-content { flex: 1; }
        .todo-title { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
        .todo-meta { font-size: 12px; color: var(--text-secondary); }
        .todo-item.completed .todo-title { color: var(--text-secondary); text-decoration: line-through; }
        .english-learning-card { background: var(--bg-card); border-radius: 8px; padding: 20px; margin-top: 24px; }
        .english-learning-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--accent); }
        .english-learning-content { background: var(--bg-secondary); border-radius: 6px; padding: 16px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; color: var(--text-secondary); }
        .english-learning-content strong { color: var(--text-primary); }
        .empty-todo { text-align: center; padding: 20px; color: var(--text-secondary); font-size: 13px; }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="logo">A8工作台</h1>
            <div class="header-right">
                <span class="user-name">老蒋</span>
            </div>
        </header>
        <div class="main-container">
            <nav class="sidebar">
                <ul class="nav-list">
                    <li class="nav-item active" data-module="home">
                        <span class="nav-icon">🏠</span>
                        <span>首页</span>
                    </li>
                    <li class="nav-item" data-module="dashboard">
                        <span class="nav-icon">📋</span>
                        <span>任务看板</span>
                    </li>
                    <li class="nav-item" data-module="templates">
                        <span class="nav-icon">📝</span>
                        <span>指令模板</span>
                    </li>
                    <li class="nav-item" data-module="projects">
                        <span class="nav-icon">📁</span>
                        <span>项目管理</span>
                    </li>
                    <li class="nav-item" data-module="knowledge">
                        <span class="nav-icon">🧠</span>
                        <span>知识库</span>
                    </li>
                    <li class="nav-item" data-module="reviews">
                        <span class="nav-icon"></span>
                        <span>异常复盘</span>
                    </li>
                </ul>
            </nav>
            <main class="content">
                <section id="home" class="module-content active">
                    <div class="module-header">
                        <h2>每日待办</h2>
                        <button class="btn btn-primary" onclick="refreshDailyTodo()">刷新</button>
                    </div>
                    <div class="daily-todo-container">
                        <div class="todo-section">
                            <h3 class="todo-section-title">📌 老蒋要做</h3>
                            <div class="todo-list" id="user-todo-list"></div>
                        </div>
                        <div class="todo-section">
                            <h3 class="todo-section-title">⚡ A8要做</h3>
                            <div class="todo-list" id="a8-todo-list"></div>
                        </div>
                    </div>
                    <div class="english-learning-card" id="english-learning-card" style="display:none;">
                        <h3>🎧 今日英语学习</h3>
                        <div class="english-learning-content" id="english-learning-content"></div>
                    </div>
                </section>
                <section id="dashboard" class="module-content">
                    <div class="module-header">
                        <h2>任务看板</h2>
                        <button class="btn btn-primary" onclick="refreshTasks()">刷新</button>
                    </div>
                    <div class="task-stats">
                        <div class="stat-card">
                            <div class="stat-number" id="active-count">0</div>
                            <div class="stat-label">启用中</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="inactive-count">0</div>
                            <div class="stat-label">已停用</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="total-tasks">0</div>
                            <div class="stat-label">总任务</div>
                        </div>
                    </div>
                    <div class="task-list" id="task-list"></div>
                </section>
                <section id="templates" class="module-content">
                    <div class="module-header">
                        <h2>指令模板</h2>
                        <button class="btn btn-primary" onclick="backToTemplates()">+ 新建模板</button>
                    </div>
                    <div class="template-categories" id="template-categories"></div>
                    <div class="template-detail" id="template-detail">
                        <div class="template-detail-card">
                            <div class="breadcrumb">
                                <a onclick="backToTemplates()">指令模板</a>
                                <span>›</span>
                                <span id="breadcrumb-template-name"></span>
                            </div>
                            <div class="template-detail-title" id="template-detail-title"></div>
                            <div class="template-detail-desc" id="template-detail-desc"></div>
                            <div class="template-preview" id="template-preview"></div>
                            <div class="template-form" id="template-form"></div>
                            <div class="template-tips" id="template-tips" style="background:rgba(0,217,255,0.08);border-radius:6px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:var(--text-secondary);line-height:1.6;"></div>
                            <div class="template-actions">
                                <button class="btn btn-primary" onclick="sendTemplate()">发送给A8</button>
                                <button class="btn btn-copy" onclick="copyTemplate()">复制指令</button>
                            </div>
                        </div>
                    </div>
                </section>
                <section id="projects" class="module-content">
                    <div class="project-list-view" id="project-list-view">
                        <div class="module-header">
                            <h2>项目管理</h2>
                            <button class="btn btn-primary">+ 新建项目</button>
                        </div>
                        <div class="project-list" id="project-list"></div>
                    </div>
                    <div class="project-detail" id="project-detail">
                        <div class="breadcrumb">
                            <a onclick="backToProjects()">项目管理</a>
                            <span>›</span>
                            <span id="breadcrumb-project-name"></span>
                        </div>
                        <div class="project-detail-header">
                            <h2 id="detail-project-name"></h2>
                            <div class="project-detail-desc" id="detail-project-desc"></div>
                            <div class="project-detail-progress">
                                <div class="progress-bar"><div class="progress-fill" id="detail-progress-fill"></div></div>
                                <span class="progress-text" id="detail-progress-text"></span>
                            </div>
                        </div>
                        <div class="kanban-board" id="kanban-board"></div>
                    </div>
                </section>
                <section id="knowledge" class="module-content">
                    <div class="module-header">
                        <h2>知识库</h2>
                        <button class="btn btn-primary" onclick="backToKnowledge()">+ 新增知识</button>
                    </div>
                    <!-- 英语学习专区：今日学习 -->
                    <div id="english-today-section" style="display:none;margin-bottom:24px;">
                        <div style="background:var(--bg-card);border-radius:8px;padding:20px;border:1px solid var(--accent);">
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                                <h3 style="color:var(--accent);font-size:18px;">📖 今日英语学习</h3>
                                <span id="english-today-tag" style="font-size:12px;padding:3px 10px;border-radius:4px;background:rgba(0,217,255,0.15);color:var(--accent);"></span>
                            </div>
                            <div id="english-today-audio" style="margin-bottom:16px;"></div>
                            <div id="english-today-body" style="font-size:14px;line-height:1.8;color:var(--text-secondary);"></div>
                        </div>
                    </div>
                    <!-- 英语学习专区：历史归档 -->
                    <div id="english-archive-section" style="display:none;margin-bottom:24px;">
                        <div style="background:var(--bg-card);border-radius:8px;overflow:hidden;">

        function renderTodos(containerId, todos, type) {
            const container = document.getElementById(containerId);

                return;
            }
            container.innerHTML = todos.map(todo => `
                <div class="todo-item ${todo.completed ? 'completed' : ''}" data-id="${todo.id}">

        function toggleTodo(type, todoId) {
            console.log(`切换待办状态: ${type} - ${todoId}`);

            const checkbox = event.target;
            checkbox.classList.toggle('checked');
            const todoItem = checkbox.closest('.todo-item');
            todoItem.classList.toggle('completed');
        }

        function loadEnglishLearning() {
            // 从本地JSON文件加载今日英语学习内容
            // 文件路径: ./英语学习/每日内容/today.json
            fetch('./英语学习/每日内容/today.json?v=' + Date.now())
                .then(res => {
                    if (!res.ok) throw new Error('Not found');
                    return res.json();
                })
                .then(data => {
                    const card = document.getElementById('english-learning-card');
                    const content = document.getElementById('english-learning-content');
                    card.style.display = 'block';
                    content.innerHTML = formatEnglishContent(data);
                })
                .catch(() => {
                    // 没有今日内容，显示默认提示
                    const card = document.getElementById('english-learning-card');
                    const content = document.getElementById('english-learning-content');
                    card.style.display = 'block';
                    content.innerHTML = '今日学习内容尚未生成，请等待A8推送或<a onclick="refreshDailyTodo()" style="color:var(--accent);cursor:pointer;">刷新</a>';
                });
        }
        
        function formatEnglishContent(data) {
            let html = '';
            // 音频播放器
            if (data.audio_file) {
                const audioSrc = './英语学习/音频/' + data.audio_file + '?v=' + Date.now();
                html += `<div style="background:var(--bg-card);border-radius:8px;padding:12px 16px;margin-bottom:16px;border:1px solid var(--border);">`;
                html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">`;
                html += `<span style="font-size:20px;">🔊</span>`;
                html += `<strong style="color:var(--accent);">今日对话音频</strong>`;
                html += `<span style="font-size:12px;color:var(--text-muted);">${data.audio_file}</span>`;
                html += `</div>`;
                html += `<audio controls style="width:100%;height:36px;" preload="metadata">`;
                html += `<source src="${audioSrc}" type="audio/mpeg">`;
                html += `您的浏览器不支持音频播放</audio>`;
                html += `</div>`;
            }
            if (data.phase) html += `<strong>当前阶段：</strong>${data.phase}<br><br>`;
            if (data.scene) html += `<strong>今日场景：</strong>${data.scene}<br><br>`;
            if (data.listening) {
                html += `<strong>🎧 听力任务</strong><br>${data.listening}<br><br>`;
            }
            if (data.sentences && data.sentences.length > 0) {
                html += `<strong>💬 场景句型</strong><br>`;
                data.sentences.forEach(s => {
                    html += `• ${s.en}<br>  ${s.cn}<br>`;
                });
                html += '<br>';
            }
            if (data.vocabulary && data.vocabulary.length > 0) {
                html += `<strong>📖 核心词汇</strong><br>`;
                data.vocabulary.forEach(v => {
                    html += `• <strong>${v.word}</strong> ${v.phonetic} - ${v.meaning}<br>`;
                });
                html += '<br>';
            }
            if (data.practice) {
                html += `<strong>🗣️ 口语练习</strong><br>${data.practice}`;
            }
            return html;
        }

        function openTemplate(templateId) {
            var tmpl = null;
            for (var i = 0; i < templatesData.length; i++) {
                for (var j = 0; j < templatesData[i].templates.length; j++) {
                    if (templatesData[i].templates[j].id === templateId) {
                        tmpl = templatesData[i].templates[j];
                        break;
                    }
                }
                if (tmpl) break;
            }
            if (!tmpl) return;
            currentTemplate = tmpl;

            document.getElementById('template-categories').style.display = 'none';
            document.getElementById('template-detail').classList.add('active');
            document.getElementById('breadcrumb-template-name').textContent = tmpl.name;
            document.getElementById('template-detail-title').textContent = tmpl.name;
            document.getElementById('template-detail-desc').textContent = tmpl.desc;

            // Render preview with highlighted variables
            var previewHtml = tmpl.templateText.replace(/\{\{(.+?)\}\}/g, '<span class="template-var">{{$1}}</span>');
            document.getElementById('template-preview').innerHTML = previewHtml;

            // Render variable input form
            var formHtml = '';
            if (tmpl.variables.length > 0) {
                tmpl.variables.forEach(function(v) {
                    formHtml += '<div class="template-form-item">' +
                        '<label>' + v.key + '</label>' +
                        '<input type="text" id="var-' + v.key + '" placeholder="' + (v.placeholder || '') + '" oninput="updatePreview()">' +
                    '</div>';
                });
            } else {
                formHtml = '<div style="color:var(--text-secondary);font-size:13px;">此模板无需填写变量</div>';
            }
            document.getElementById('template-form').innerHTML = formHtml;

            // Show tips
            document.getElementById('template-tips').innerHTML = tmpl.tips || '';
        }

        function backToTemplates() {
            document.getElementById('template-detail').classList.remove('active');
            document.getElementById('template-categories').style.display = '';
            currentTemplate = null;
        }

        function updatePreview() {
            if (!currentTemplate) return;
            var text = currentTemplate.templateText;
            currentTemplate.variables.forEach(function(v) {
                var input = document.getElementById('var-' + v.key);
                var val = input ? input.value : '';
                var display = val || '{{' + v.key + '}}';
                var regex = new RegExp('\\{\\{' + v.key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\}\\}', 'g');
                text = text.replace(regex, val ? val : '<span class="template-var">' + display + '</span>');
            });
            // If all variables filled, show clean text; otherwise highlight unfilled ones
            var allFilled = currentTemplate.variables.every(function(v) {
                var input = document.getElementById('var-' + v.key);
                return input && input.value.trim() !== '';
            });
            if (allFilled) {
                document.getElementById('template-preview').textContent = text;
            } else {
                var previewHtml = currentTemplate.templateText;
                currentTemplate.variables.forEach(function(v) {
                    var input = document.getElementById('var-' + v.key);
                    var val = input ? input.value : '';
                    var regex = new RegExp('\\{\\{' + v.key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\}\\}', 'g');
                    if (val) {
                        previewHtml = previewHtml.replace(regex, val);
                    } else {
                        previewHtml = previewHtml.replace(regex, '<span class="template-var">{{' + v.key + '}}</span>');
                    }
                });
                document.getElementById('template-preview').innerHTML = previewHtml;
            }
        }

        function getFilledTemplate() {
            if (!currentTemplate) return '';
            var text = currentTemplate.templateText;
            currentTemplate.variables.forEach(function(v) {
                var input = document.getElementById('var-' + v.key);
                var val = (input && input.value) ? input.value.trim() : '{{' + v.key + '}}';
                var regex = new RegExp('\\{\\{' + v.key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\}\\}', 'g');
                text = text.replace(regex, val);
            });
            return text;
        }

                });
            } else {
                var ta = document.createElement('textarea');

                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('已复制到剪贴板');
            }

                if (cat) {
                    var todayDay = today ? today.day : -1;
                    cat.items = entries.filter(function(e) { return e.day !== todayDay; }).map(function(e) {
                        return {
                            title: 'Day ' + e.day + ' - ' + e.scene + '（' + e.topic + '）',
                            meta: e.date + ' | ' + e.phase + ' | 句型' + e.phrases_count + '个 词汇' + e.vocab_count + '个',
                            tag: e.phase,
                            content: '__LOAD_FILE__:' + e.file,
                            file: e.file,
                            audio_file: e.audio_file || null
                        };
                    });
                }
                renderKnowledgeGrid();
            });
        }

        function renderEnglishToday(data) {
            var tag = document.getElementById('english-today-tag');
            tag.textContent = 'Day ' + data.day + ' · ' + (data.scene || '');

            // 音频
            var audioHtml = '';
            if (data.audio_file) {
                var audioSrc = './英语学习/音频/' + data.audio_file + '?v=' + Date.now();
                audioHtml += '<div style="background:var(--bg-secondary);border-radius:8px;padding:12px 16px;border:1px solid var(--border);">';
                audioHtml += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">';
                audioHtml += '<span style="font-size:20px;">🔊</span>';
                audioHtml += '<strong style="color:var(--accent);">今日对话音频</strong>';
                audioHtml += '</div>';
                audioHtml += '<audio controls style="width:100%;height:36px;" preload="metadata">';
                audioHtml += '<source src="' + audioSrc + '" type="audio/mpeg">';
                audioHtml += '您的浏览器不支持音频播放</audio>';
                audioHtml += '</div>';
            }
            document.getElementById('english-today-audio').innerHTML = audioHtml;

            // 内容
            var html = '';
            if (data.listening) {
                html += '<strong style="color:var(--text-primary);">🎧 听力任务</strong><br>' + data.listening + '<br><br>';
            }
            if (data.sentences && data.sentences.length > 0) {
                html += '<strong style="color:var(--text-primary);">💬 场景句型</strong><br>';
                data.sentences.forEach(function(s) {
                    html += '• ' + s.en + '<br>  <span style="color:var(--text-secondary);">' + s.cn + '</span><br>';
                });
                html += '<br>';
            }
            if (data.vocabulary && data.vocabulary.length > 0) {
                html += '<strong style="color:var(--text-primary);">📖 核心词汇</strong><br>';
                data.vocabulary.forEach(function(v) {
                    html += '• <strong style="color:var(--accent);">' + v.word + '</strong> ' + v.phonetic + ' - ' + v.meaning + '<br>';
                });
                html += '<br>';
            }
            if (data.practice) {
                html += '<strong style="color:var(--text-primary);">🗣️ 口语练习</strong><br>' + data.practice;
            }
            document.getElementById('english-today-body').innerHTML = html;
        }

        function renderEnglishArchiveList(entries) {
            var list = document.getElementById('english-archive-list');
            list.innerHTML = entries.map(function(e, idx) {
                var isToday = englishTodayData && e.day === englishTodayData.day;
                var badge = isToday ? '<span style="font-size:10px;padding:2px 6px;border-radius:3px;background:var(--success);color:#fff;margin-left:8px;">今天</span>' : '';
                return '<div class="knowledge-item" onclick="openEnglishArchiveDay(' + idx + ')">' +
                    '<div class="knowledge-item-title">Day ' + e.day + ' - ' + e.scene + '（' + e.topic + '）' + badge +
                    '<span class="knowledge-item-tag">' + e.phase + '</span></div>' +
                    '<div class="knowledge-item-meta">' + e.date + ' | 句型' + e.phrases_count + '个 词汇' + e.vocab_count + '个</div>' +
                '</div>';
            }).join('');
        }

        function toggleEnglishArchive() {
            var list = document.getElementById('english-archive-list');
            var arrow = document.getElementById('english-archive-arrow');
            if (list.style.display === 'none') {
                list.style.display = 'block';
                arrow.style.transform = 'rotate(180deg)';
            } else {
                list.style.display = 'none';
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        function openEnglishArchiveDay(idx) {
            var entry = englishArchiveData[idx];
            if (!entry) return;
            var ts = '?v=' + Date.now();

            document.getElementById('knowledge-grid').style.display = 'none';
            document.getElementById('english-today-section').style.display = 'none';
            document.getElementById('english-archive-section').style.display = 'none';
            document.getElementById('knowledge-detail').classList.add('active');
            document.getElementById('breadcrumb-knowledge-category').textContent = '英语学习';
            document.getElementById('knowledge-detail-title').textContent = 'Day ' + entry.day + ' - ' + entry.scene + '（' + entry.topic + '）';

            // 音频
            var audioHtml = '';
            if (entry.audio_file) {
                var audioSrc = './英语学习/音频/' + entry.audio_file + ts;
                audioHtml += '<div style="background:var(--bg-secondary);border-radius:8px;padding:12px 16px;border:1px solid var(--border);">';
                audioHtml += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">';
                audioHtml += '<span style="font-size:20px;">🔊</span>';
                audioHtml += '<strong style="color:var(--accent);">对话音频</strong>';
                audioHtml += '</div>';
                audioHtml += '<audio controls style="width:100%;height:36px;" preload="metadata">';
                audioHtml += '<source src="' + audioSrc + '" type="audio/mpeg">';
                audioHtml += '您的浏览器不支持音频播放</audio>';
                audioHtml += '</div>';
            }
            document.getElementById('knowledge-detail-audio').innerHTML = audioHtml;

            // 加载 markdown 内容
            document.getElementById('knowledge-detail-body').innerHTML = '<p style="color:var(--text-secondary)">加载中...</p>';
            fetch('./英语学习/每日内容/' + entry.file + ts)
                .then(function(r) { return r.ok ? r.text() : null; })
                .then(function(md) {
                    if (md) {
                        document.getElementById('knowledge-detail-body').innerHTML = simpleMarkdown(md);
                    } else {
                        document.getElementById('knowledge-detail-body').innerHTML = '<p style="color:var(--danger)">文件加载失败</p>';
                    }
                })
                .catch(function() {
                    document.getElementById('knowledge-detail-body').innerHTML = '<p style="color:var(--danger)">文件加载失败</p>';
                });
        }

        function renderKnowledgeGrid() {
            var grid = document.getElementById('knowledge-grid');
            grid.innerHTML = knowledgeData.map(function(cat) {
                var items = cat.items.map(function(item, idx) {
                    return '<div class="knowledge-item" onclick="openKnowledgeItem(\'' + cat.id + '\',' + idx + ')">' +
                        '<div class="knowledge-item-title">' + item.title + '<span class="knowledge-item-tag">' + item.tag + '</span></div>' +
                        '<div class="knowledge-item-meta">' + item.meta + '</div>' +
                    '</div>';
                }).join('');
                return '<div class="knowledge-panel" id="kpanel-' + cat.id + '">' +
                    '<div class="knowledge-panel-header" onclick="toggleKnowledgePanel(\'' + cat.id + '\')">' +
                        '<h3>' + cat.icon + ' ' + cat.name + '</h3>' +
                        '<span class="knowledge-panel-count">' + cat.items.length + '</span>' +
                    '</div>' +
                    '<div class="knowledge-panel-body">' + items + '</div>' +
                '</div>';
            }).join('');
        }

        function toggleKnowledgePanel(catId) {
            var panel = document.getElementById('kpanel-' + catId);
            panel.classList.toggle('expanded');
        }

        function openKnowledgeItem(catId, idx) {
            var cat = knowledgeData.find(function(c) { return c.id === catId; });
            if (!cat || !cat.items[idx]) return;
            var item = cat.items[idx];

            document.getElementById('knowledge-grid').style.display = 'none';
            document.getElementById('knowledge-detail').classList.add('active');
            document.getElementById('breadcrumb-knowledge-category').textContent = cat.name;
            document.getElementById('knowledge-detail-title').textContent = item.title;

            // 如果是英语学习内容，从 markdown 文件动态加载
            if (item.content && item.content.indexOf('__LOAD_FILE__:') === 0) {
                var fileName = item.content.replace('__LOAD_FILE__:', '');
                document.getElementById('knowledge-detail-body').innerHTML = '<p style="color:var(--text-secondary)">加载中...</p>';
                fetch('./英语学习/每日内容/' + fileName)
                    .then(function(r) { return r.ok ? r.text() : null; })
                    .then(function(md) {
                        if (md) {
                            document.getElementById('knowledge-detail-body').innerHTML = simpleMarkdown(md);
                        } else {
                            document.getElementById('knowledge-detail-body').innerHTML = '<p style="color:var(--danger)">文件加载失败</p>';
                        }
                    })
                    .catch(function() {
                        document.getElementById('knowledge-detail-body').innerHTML = '<p style="color:var(--danger)">文件加载失败</p>';
                    });
            } else {
                document.getElementById('knowledge-detail-body').innerHTML = item.content.replace(/\n/g, '<br>');
            }
        }

        // 简易 Markdown 渲染（标题、粗体、列表、表格、引用、分割线）
        function simpleMarkdown(md) {
            var html = md
                .replace(/^### (.+)$/gm, '<h4 style="color:var(--accent);margin:16px 0 8px">$1</h4>')
                .replace(/^## (.+)$/gm, '<h3 style="color:var(--accent);margin:20px 0 10px;font-size:18px">$1</h3>')
                .replace(/^# (.+)$/gm, '<h2 style="color:var(--accent);margin:24px 0 12px;font-size:22px">$1</h2>')
                .replace(/^> (.+)$/gm, '<blockquote style="border-left:3px solid var(--accent);padding-left:12px;color:var(--text-secondary);margin:8px 0">$1</blockquote>')
                .replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--text-primary)">$1</strong>')
                .replace(/^- (.+)$/gm, '• $1<br>')
                .replace(/^---$/gm, '<hr style="border:none;border-top:1px solid var(--border);margin:16px 0">')
                .replace(/\n{2,}/g, '<br><br>')
                .replace(/\n/g, '<br>');
            return html;
        }

        function backToKnowledge() {
            document.getElementById('knowledge-detail').classList.remove('active');
            document.getElementById('knowledge-detail').style.display = 'none';
            document.getElementById('knowledge-detail-audio').innerHTML = '';
            document.getElementById('knowledge-grid').style.display = '';
            // 恢复英语学习专区显示
            if (englishTodayData) {
                document.getElementById('english-today-section').style.display = 'block';
            }
            if (englishArchiveData.length > 0) {
                document.getElementById('english-archive-section').style.display = 'block';
            }
            // 恢复毛选学习专区显示
            if (maoxuanData) {
                document.getElementById('maoxuan-section').style.display = 'block';
                if (maoxuanData.articles.length > 0) {
                    document.getElementById('maoxuan-archive-section').style.display = 'block';
                }
            }
        }

        function openProject(projectId) {
            const project = projectsData.find(p => p.id === projectId);
            if (!project) return;
            showProjectDetail(project);
        }

        function backToProjects() {
            document.getElementById('project-detail').classList.remove('active');
            document.getElementById('project-list-view').classList.remove('hidden');
        }

        function showProjectDetail(project) {
            document.getElementById('project-list-view').classList.add('hidden');
            document.getElementById('project-detail').classList.add('active');
            document.getElementById('breadcrumb-project-name').textContent = project.name;
            document.getElementById('detail-project-name').textContent = project.name;
            document.getElementById('detail-project-desc').textContent = project.desc;
            document.getElementById('detail-progress-fill').style.width = project.progress + '%';
            document.getElementById('detail-progress-text').textContent = project.progress + '%';
            renderKanban(project.stages);
        }

        function renderKanban(stages) {
            const board = document.getElementById('kanban-board');
            board.innerHTML = stages.map(stage => {
                const statusClass = stage.status === '已完成' ? 'status-completed' : stage.status === '进行中' ? 'status-in-progress' : 'status-not-started';
                const cards = stage.items.map(item => {
                    const tagClass = item.type === '交付物' ? 'tag-deliverable' : item.type === '里程碑' ? 'tag-milestone' : 'tag-task';
                    return `
                        <div class="kanban-card">
                            <div class="kanban-card-title">${item.title}</div>
                            ${item.meta ? '<div class="kanban-card-meta">' + item.meta + '</div>' : ''}
                            <span class="kanban-card-tag ${tagClass}">${item.type}</span>
                        </div>
                    `;
                }).join('');
                return `
                    <div class="kanban-column ${statusClass}">
                        <div class="kanban-column-header">
                            <span class="kanban-column-title">${stage.name}</span>
                            <span class="kanban-column-count">${stage.items.length}</span>
                        </div>
                        ${cards}
                    </div>
                `;
            }).join('');
        }
        // 复盘铁规
        var REVIEW_RULE = '问题提出后24H内必须完成复盘。复盘内容必须包含：(1)根因分析——为什么出问题，不回避责任，可以是我的问题也可以是老蒋的问题；(2)改进措施——以后具体怎么做，可执行可检查。';

        var reviewsData = [
            {
                id: 1,
                title: '称呼错误 - "老胥"',
                date: '2026-07-01',
                status: 'completed',
                summary: '错误使用姓氏作为称呼，应以日常使用称呼为准',
                analysis: {
                    root_cause: '我把"胥"当成了姓氏去称呼，实际上"小胥"是交友平台上的昵称，不是姓氏。我犯了先入为主的错误——看到一个字就自动归类为姓，没有先去确认用户的实际偏好。',
                    my_fault: '没有提前确认称呼偏好，凭猜测行事。',
                    user_fault: '无明显问题。',
                    actions: ['所有称呼以用户明确告知的为准，不猜测。', '涉及人名/称呼的场景，首次出现时必须确认。']
                }
            },
            {
                id: 2,
                title: '搏蔓项目交付延期',
                date: '2026-07-03',
                deadline: '2026-07-04 23:59',
                status: 'completed',
                summary: '未按demo执行，未主动汇报进度，交付物质量不达标',
                analysis: {
                    root_cause: '三个问题叠加：(1)拿到demo后没逐功能点拆解确认，凭自己理解直接做，用动手代替思考；(2)没有设置中间检查点主动同步进度，怕暴露不确定性所以选择沉默，结果信息真空越拖越大；(3)质量把关依赖你，半成品就交付，把质检责任推给了你。',
                    my_fault: '需求理解停留在表面、进度汇报机制缺失、交付前不自检。核心原因是不愿意暴露自己的不确定和卡点，怕问了显得不行，结果反而更不行。',
                    user_fault: '(1)验收标准没量化——demo有，但哪些必须1:1还原、哪些可以灵活处理、交付前过哪些检查点，没有明确写下来，执行时其实也在猜预期；(2)中间没有设检查点——默认我会主动同步，但没有明确要求"做到XX的时候告诉我"，两边都在等对方主动。',
                    actions: ['拿到需求先拆功能清单→逐条确认→有疑义先问清再做，不确定的标红不自己猜。', '大任务拆2-3个中间节点，每个节点主动同步进度和卡点，不等到最后才暴露。', '交付前对照demo逐条自检，写清楚哪些已验证、哪些有差异，带自检报告交付。']
                }
            }
        ];

        function initReviews() {
            renderReviews();
            updateReviewStats();
        }

        function renderReviews() {
            var reviewList = document.getElementById('review-list');
            if (reviewsData.length === 0) {
                reviewList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-text">暂无复盘记录</div></div>';
                return;
            }
            // 复盘规则提示
            var ruleHtml = '<div style="background:var(--bg-card);border-radius:8px;padding:14px 18px;margin-bottom:16px;border-left:3px solid var(--warning);">' +
                '<strong style="color:var(--warning);">️ 复盘铁规：</strong>' +
                '<span style="color:var(--text-secondary);font-size:13px;">' + REVIEW_RULE + '</span>' +
            '</div>';
            var itemsHtml = reviewsData.map(function(review) {
                var statusLabel = review.status === 'pending' ? '待复盘' : '已完成';
                var statusClass = review.status === 'pending' ? 'pending' : 'completed';
                var deadlineHtml = review.deadline ? '<span style="font-size:11px;color:var(--warning);margin-left:8px;">截止 ' + review.deadline + '</span>' : '';
                return '<div class="review-item" onclick="toggleReviewDetail(' + review.id + ')">' +
                    '<div class="review-header">' +
                        '<span class="review-title">' + review.title + '</span>' +
                        '<span class="review-date">' + review.date + deadlineHtml + '</span>' +
                    '</div>' +
                    '<span class="review-status ' + statusClass + '">' + statusLabel + '</span>' +
                    '<div class="review-summary">' + review.summary + '</div>' +
                    '<div class="review-detail" id="review-detail-' + review.id + '" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;line-height:1.8;color:var(--text-secondary);">' +
                        renderReviewAnalysis(review) +
                    '</div>' +
                '</div>';
            }).join('');
            reviewList.innerHTML = ruleHtml + itemsHtml;
        }

        function renderReviewAnalysis(review) {
            if (!review.analysis) return '<p>暂无复盘分析</p>';
            var a = review.analysis;
            var html = '';
            html += '<strong style="color:var(--text-primary);">🔍 根因分析：</strong><br>' + a.root_cause + '<br><br>';
            html += '<strong style="color:var(--danger);">我的问题：</strong><br>' + a.my_fault + '<br><br>';
            html += '<strong style="color:var(--warning);">你的问题：</strong><br>' + a.user_fault + '<br><br>';
            html += '<strong style="color:var(--success);">✅ 改进措施：</strong><br>';
            a.actions.forEach(function(act, i) {
                html += (i + 1) + '. ' + act + '<br>';
            });
            return html;
        }

        function toggleReviewDetail(id) {
            var el = document.getElementById('review-detail-' + id);
            if (!el) return;
            if (el.style.display === 'none') {
                el.style.display = 'block';
            } else {
                el.style.display = 'none';
            }
        }

        function updateReviewStats() {
            document.getElementById('pending-count').textContent = reviewsData.filter(function(r) { return r.status === 'pending'; }).length;
            document.getElementById('completed-count').textContent = reviewsData.filter(function(r) { return r.status === 'completed'; }).length;
        }
    </script>
</body>
</html>
